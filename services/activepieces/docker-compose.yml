services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AP_POSTGRES_USER:-activepieces}
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:-activepieces}
      POSTGRES_DB: ${AP_POSTGRES_DB:-activepieces}
    volumes:
      - ap_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${AP_POSTGRES_USER:-activepieces}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - ap_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  activepieces:
    image: activepieces/activepieces:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${AP_PORT:-8080}:80'
    environment:
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:-http://localhost:8080}
      AP_ALLOWED_EMBED_ORIGINS: ${AP_ALLOWED_EMBED_ORIGINS:-http://localhost:5173,http://localhost:3001}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY:-change-me-32-char-encryption-key!!}
      AP_JWT_SECRET: ${AP_JWT_SECRET:-change-me-jwt-secret-key-here}
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DB:-activepieces}
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USER:-activepieces}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD:-activepieces}
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: 6379
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_TELEMETRY_ENABLED: 'false'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    volumes:
      - ap_cache:/root/.activepieces

volumes:
  ap_postgres_data:
  ap_redis_data:
  ap_cache:
